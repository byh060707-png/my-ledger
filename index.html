<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="人民币与卢布双币种个人记账本">
<link rel="manifest" href="./manifest.json">
<title>我的记账本</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--soft:#f3f4f6;--primary:#111827;--good:#059669;--bad:#dc2626;--warn:#b45309;--shadow:0 5px 22px rgba(17,24,39,.07)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100vh}
button,input,select{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;padding:20px 18px 14px;background:var(--primary);color:#fff}.top h1{margin:0;font-size:25px}.top small{display:block;margin-top:5px;opacity:.72}.content{padding:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:var(--soft);border-radius:14px;padding:13px}.mini .muted{display:block}.mini b{display:block;margin-top:5px;font-size:18px}.balance{font-size:32px;font-weight:800;margin:7px 0 12px}.muted{font-size:13px;color:var(--muted)}.section-title{font-weight:800;margin-bottom:10px}.subtle{background:var(--soft);padding:3px 7px;border-radius:8px;font-size:12px}
button.primary{background:var(--primary);color:#fff;padding:11px 14px;border-radius:12px;font-weight:700}button.secondary{background:var(--soft);color:var(--text);padding:10px 13px;border-radius:12px}button.danger{background:#fee2e2;color:#991b1b;padding:10px 13px;border-radius:12px}button.link{background:none;color:var(--text);padding:0}
.item{padding:12px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}.titleline{display:flex;align-items:center;gap:8px}.amount{font-weight:800;white-space:nowrap}.plus{color:var(--good)}.minus{color:var(--bad)}.warning{color:var(--warn)}
.searchbar{position:sticky;top:78px;z-index:9;background:var(--bg);padding-bottom:8px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters input,.filters select,.form input,.form select,.form textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);outline:none}.form textarea{min-height:90px;resize:vertical}.form label{display:block;margin:11px 0 5px;font-size:13px;color:var(--muted)}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:68px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:none;color:#6b7280;font-size:12px}.nav button .ico{font-size:20px;display:block;line-height:23px}.nav button.active{color:var(--text);font-weight:800}.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:25;width:min(650px,calc(100% - 28px));padding:14px 18px;border-radius:16px;background:var(--primary);color:#fff;font-weight:800;box-shadow:0 12px 28px rgba(17,24,39,.25)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));margin:auto 0 0}.sheet h2{margin:0;font-size:21px}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions>*{flex:1;min-width:120px}.type-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:var(--soft);padding:5px;border-radius:13px}.type-tabs button{padding:10px 6px;background:transparent;color:var(--muted);border-radius:10px}.type-tabs button.active{background:#fff;color:var(--text);font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.pill{padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}.empty{text-align:center;color:#9ca3af;padding:26px 10px}.hidden{display:none!important}
.statbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.statbar i{display:block;height:100%;background:var(--primary)}.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 4px 0;border-bottom:1px solid var(--border)}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}.col i{width:100%;max-width:30px;background:var(--primary);border-radius:8px 8px 0 0;min-height:2px}.col span{font-size:10px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px}.switch input{display:none}.switch span{position:absolute;inset:0;background:#d1d5db;border-radius:99px;transition:.2s}.switch span:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+span{background:var(--primary)}.switch input:checked+span:after{left:21px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(12px);background:#111827;color:white;padding:11px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90%;font-size:14px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){.grid3{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.balance{font-size:29px}.top{padding-top:16px}.fab{bottom:76px}}
body.dark{--bg:#0b1220;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#263244;--soft:#1b2433;--primary:#f3f4f6;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--shadow:0 6px 24px rgba(0,0,0,.25)}body.dark button.primary{color:#111827}body.dark .nav{background:rgba(17,24,39,.97)}body.dark .modal .sheet{background:#111827}body.dark input,body.dark select,body.dark textarea{background:#0f172a;color:#f3f4f6}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>我的记账本</h1><small id="today"></small></header>
<main class="content">
<section id="page-home">
 <div class="card">
  <div class="row"><div class="muted">总资产 · 折算人民币</div><button class="secondary" onclick="openSettings()">⚙️</button></div>
  <div class="balance" id="totalCny">¥0.00</div>
  <div class="grid"><div class="mini"><span>🇨🇳 人民币</span><b id="cnyTotal">¥0.00</b></div><div class="mini"><span>🇷🇺 卢布</span><b id="rubTotal">₽0.00</b></div></div>
 </div>
 <div class="card"><div class="row"><div class="section-title">本月概览</div><span class="subtle" id="monthLabel"></span></div>
  <div class="grid3"><div class="mini"><span class="muted">收入</span><b class="plus" id="homeIncome">¥0</b></div><div class="mini"><span class="muted">支出</span><b class="minus" id="homeExpense">¥0</b></div><div class="mini"><span class="muted">结余</span><b id="homeNet">¥0</b></div></div>
  <div style="margin-top:13px"><div class="row"><span class="muted">本月预算</span><span id="budgetText" class="muted">未设置</span></div><div class="progress" style="margin-top:7px"><i id="budgetBar" style="width:0%"></i></div></div>
 </div>
 <div class="card"><div class="row"><div class="section-title">账户</div><button class="secondary" onclick="openAccount()">＋账户</button></div><div id="accountHome"></div></div>
 <div class="card"><div class="row"><div class="section-title">最近账单</div><button class="secondary" onclick="showPage('bills')">全部</button></div><div id="recent"></div></div>
</section>

<section id="page-bills" class="hidden">
 <div class="searchbar"><div class="filters"><input id="search" placeholder="搜索备注、分类、账户..." oninput="renderBills()"><select id="monthFilter" onchange="renderBills()"><option value="all">全部月份</option></select></div><div class="filters" style="margin-top:8px"><select id="typeFilter" onchange="renderBills()"><option value="all">全部类型</option><option value="income">收入</option><option value="expense">支出</option><option value="transfer">转账 / 换汇</option></select><select id="currencyFilter" onchange="renderBills()"><option value="all">全部币种</option><option value="CNY">CNY 人民币</option><option value="RUB">RUB 卢布</option></select></div></div>
 <div class="card"><div class="row"><div class="section-title">账单记录</div><span class="muted" id="billCount"></span></div><div id="billList"></div></div>
</section>

<section id="page-accounts" class="hidden"><div class="card"><div class="row"><div class="section-title">账户管理</div><button class="primary" onclick="openAccount()">＋账户</button></div><div id="accountList"></div></div></section>

<section id="page-stats" class="hidden"><div class="card"><div class="row"><div class="section-title">统计分析</div><select id="statMonth" style="width:auto;padding:8px 10px" onchange="renderStats()"></select></div><div class="grid"><div class="mini"><span class="muted">收入</span><b class="plus" id="monthIn">¥0</b></div><div class="mini"><span class="muted">支出</span><b class="minus" id="monthOut">¥0</b></div></div><div id="categoryStats" style="margin-top:15px"></div><div class="section-title" style="margin-top:18px">近半年支出</div><div id="sixMonthChart" class="chart"></div></div></section>

<section id="page-settings" class="hidden">
 <div class="card"><div class="section-title">基础设置</div><div class="form">
  <label>1 CNY = 多少 RUB（用于资产折算和统计）</label><input id="rateInput" type="number" step="0.0001">
  <label>每月预算（人民币）</label><input id="budgetInput" type="number" step="0.01" min="0">
  <div class="row" style="margin-top:14px"><div><b>深色模式</b><div class="muted">晚上看账单更舒服</div></div><label class="switch"><input id="darkMode" type="checkbox" onchange="toggleDark()"><span></span></label></div>
  <div class="actions"><button class="secondary" onclick="saveSettings()">保存设置</button><button class="secondary" onclick="openCategoryManager()">管理分类</button></div>
 </div></div>
 <div class="card"><div class="section-title">数据安全</div><p class="muted">账目目前保存在本设备浏览器。建议定期导出备份。</p><div class="actions"><button class="secondary" onclick="exportData()">JSON备份</button><button class="secondary" onclick="exportCSV()">导出CSV</button><button class="secondary" onclick="document.getElementById('importFile').click()">导入备份</button></div><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div>
 <div class="card"><div class="section-title">数据维护</div><div class="actions"><button class="secondary" onclick="seedDemo()">生成演示数据</button><button class="danger" onclick="resetData()">清空全部数据</button></div></div>
 <div class="card"><div class="muted">版本 2.0 · 双币种个人财务</div></div>
</section>
</main>
<button class="fab" onclick="openTx()">＋ 记一笔</button>
<nav class="nav">
 <button class="active" data-page="home" onclick="showPage('home',this)"><span class="ico">⌂</span>首页</button>
 <button data-page="bills" onclick="showPage('bills',this)"><span class="ico">☷</span>账单</button>
 <button data-page="accounts" onclick="showPage('accounts',this)"><span class="ico">◉</span>账户</button>
 <button data-page="stats" onclick="showPage('stats',this)"><span class="ico">▥</span>统计</button>
</nav>
</div>
<div id="toast" class="toast"></div>

<div class="modal" id="txModal"><div class="sheet form">
 <div class="row"><h2 id="txTitle">记一笔</h2><button class="secondary" onclick="closeModal('txModal')">关闭</button></div>
 <div class="type-tabs" style="margin-top:14px"><button id="tabExpense" onclick="setTxType('expense')">支出</button><button id="tabIncome" onclick="setTxType('income')">收入</button><button id="tabTransfer" onclick="setTxType('transfer')">转账 / 换汇</button></div>
 <input id="editTxId" type="hidden"><div id="normalFields"><label>金额</label><input id="txAmount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00"><label>币种</label><select id="txCurrency" onchange="syncTxAccountToCurrency()"></select><label>账户</label><select id="txAccount"></select><label>分类</label><select id="txCategory"></select></div>
 <div id="transferFields" class="hidden"><label>转出金额</label><input id="trFromAmount" type="number" step="0.01" min="0.01" inputmode="decimal"><label>转出账户</label><select id="trFrom" onchange="syncTransferCurrency()"></select><label>转入金额</label><input id="trToAmount" type="number" step="0.01" min="0.01" inputmode="decimal"><label>转入账户</label><select id="trTo" onchange="syncTransferCurrency()"></select><div class="mini" style="margin-top:10px"><span class="muted">换汇比率（转入 / 转出）</span><b id="trRateText">1</b></div></div>
 <label>日期</label><input id="txDate" type="date"><label>备注</label><input id="txNote" placeholder="例如：午饭、房租、家里转账"><div class="actions"><button class="secondary" onclick="closeModal('txModal')">取消</button><button class="primary" onclick="saveTx()">保存</button></div>
 </div></div>

<div class="modal" id="accModal"><div class="sheet form"><div class="row"><h2 id="accTitle">添加账户</h2><button class="secondary" onclick="closeModal('accModal')">关闭</button></div><input id="editAccId" type="hidden"><label>账户名称</label><input id="accName" placeholder="例如：Сбербанк / 微信 / 现金"><label>账户类型</label><select id="accType"><option value="bank">银行</option><option value="wallet">电子钱包</option><option value="cash">现金</option><option value="card">银行卡 / 信用卡</option><option value="other">其他</option></select><label>币种</label><select id="accCurrency"><option value="RUB">🇷🇺 RUB 卢布</option><option value="CNY">🇨🇳 CNY 人民币</option></select><label>初始余额</label><input id="accBalance" type="number" step="0.01" inputmode="decimal" value="0"><div class="actions"><button class="secondary" onclick="closeModal('accModal')">取消</button><button class="primary" onclick="saveAccount()">保存</button></div></div></div>

<div class="modal" id="categoryModal"><div class="sheet form"><div class="row"><h2>管理分类</h2><button class="secondary" onclick="closeModal('categoryModal')">关闭</button></div><div id="categoryList" style="margin-top:10px"></div><div class="actions"><button class="secondary" onclick="addCategory()">＋新增分类</button><button class="primary" onclick="closeModal('categoryModal')">完成</button></div></div></div>

<div class="modal" id="settingsModal"><div class="sheet form"><div class="row"><h2>设置</h2><button class="secondary" onclick="closeModal('settingsModal')">关闭</button></div><p class="muted">这里也可以从“统计”页面进入完整设置。</p><div class="actions"><button class="primary" onclick="closeModal('settingsModal');showPage('settings')">打开设置</button></div></div></div>

<script>
const KEY='my_ledger_v1', VERSION=2;
const defaultCategories=['餐饮','购物','交通','房租','娱乐','学习','医疗','工资','水电','旅行','其他'];
const defaultDB={version:VERSION,rate:11,budget:0,dark:false,categories:[...defaultCategories],accounts:[{id:1,name:'Сбербанк',type:'bank',currency:'RUB',initial:0},{id:2,name:'微信',type:'wallet',currency:'CNY',initial:0},{id:3,name:'现金',type:'cash',currency:'RUB',initial:0}],tx:[]};
let db=loadDB(), currentTxType='expense';
if(!Array.isArray(db.accounts))db.accounts=[];
db.accounts.forEach(a=>{if(a.active===undefined)a.active=true});
function loadDB(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return structuredClone(defaultDB);const d=raw;d.version=VERSION;d.rate=Number(d.rate)||11;d.budget=Number(d.budget)||0;d.dark=!!d.dark;d.categories=Array.isArray(d.categories)&&d.categories.length?d.categories:[...defaultCategories];d.accounts=(d.accounts||[]).map((a,i)=>({...a,id:Number(a.id)||Date.now()+i,type:a.type||'bank',initial:Number(a.initial)||0,active:a.active!==false}));d.tx=(d.tx||[]).map((t,i)=>({...t,id:Number(t.id)||Date.now()+i,amount:Number(t.amount)||0}));return d}catch(e){alert('数据读取失败，将使用空白账本。');return structuredClone(defaultDB)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n,c){const v=Number(n)||0;return c==='CNY'?'¥'+v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):'₽'+v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})}
function baseCny(amount,c){return c==='CNY'?Number(amount):Number(amount)/db.rate}
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function accBy(id){return db.accounts.find(a=>Number(a.id)===Number(id))}
function accountBalances(){const b={};db.accounts.forEach(a=>b[a.id]=Number(a.initial)||0);for(const t of db.tx){if(t.type==='income')b[t.account]=(b[t.account]||0)+Number(t.amount||0);else if(t.type==='expense')b[t.account]=(b[t.account]||0)-Number(t.amount||0);else if(t.type==='transfer'){b[t.from]=(b[t.from]||0)-Number(t.fromAmount||t.amount||0);b[t.to]=(b[t.to]||0)+Number(t.toAmount||t.amount||0)}}return b}
function monthKey(date){return String(date).slice(0,7)}
function selectedMonth(){return document.getElementById('statMonth')?.value||monthKey(new Date())}
function transactionsForMonth(ym){return db.tx.filter(t=>monthKey(t.date)===ym)}
function summaryMonth(ym){let inc=0,exp=0;const cats={};for(const t of transactionsForMonth(ym)){if(t.type==='income'){inc+=baseCny(t.amount,t.currency)}else if(t.type==='expense'){const v=baseCny(t.amount,t.currency);exp+=v;cats[t.category]=(cats[t.category]||0)+v}}return{inc,exp,cats}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1900)}
function render(){renderHome();populateFilters();renderBills();renderAccounts();renderStats();renderCategories();renderSettings();document.body.classList.toggle('dark',db.dark)}
function renderHome(){const b=accountBalances();const cny=db.accounts.filter(a=>a.currency==='CNY').reduce((s,a)=>s+(b[a.id]||0),0);const rub=db.accounts.filter(a=>a.currency==='RUB').reduce((s,a)=>s+(b[a.id]||0),0);document.getElementById('cnyTotal').textContent=fmt(cny,'CNY');document.getElementById('rubTotal').textContent=fmt(rub,'RUB');document.getElementById('totalCny').textContent=fmt(cny+rub/db.rate,'CNY');const ym=monthKey(new Date()),s=summaryMonth(ym);document.getElementById('monthLabel').textContent=ym;document.getElementById('homeIncome').textContent=fmt(s.inc,'CNY');document.getElementById('homeExpense').textContent=fmt(s.exp,'CNY');document.getElementById('homeNet').textContent=fmt(s.inc-s.exp,'CNY');document.getElementById('budgetText').textContent=db.budget>0?`${fmt(s.exp,'CNY')} / ${fmt(db.budget,'CNY')}`:'未设置';document.getElementById('budgetBar').style.width=db.budget>0?Math.min(100,s.exp/db.budget*100)+'%':'0%';const items=db.accounts.map(a=>{const bal=b[a.id]||0;return `<div class="item row"><div><div class="titleline"><span>${a.currency==='CNY'?'🇨🇳':'🇷🇺'}</span><b>${esc(a.name)}</b></div><small class="muted">${typeLabel(a.type)} · ${a.currency}</small></div><b>${fmt(bal,a.currency)}</b></div>`}).join('');document.getElementById('accountHome').innerHTML=items||'<div class="empty">还没有账户</div>';const recent=db.tx.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.id)-Number(a.id)).slice(0,6);document.getElementById('recent').innerHTML=recent.map(renderTxRow).join('')||'<div class="empty">还没有账单，点击“＋ 记一笔”开始。</div>'}
function renderTxRow(t){const sign=t.type==='income'?'+':t.type==='expense'?'−':'';let label='';if(t.type==='transfer'){const f=accBy(t.from),to=accBy(t.to);label=`${f?.name||'已删除'} → ${to?.name||'已删除'}`;if(t.fromCurrency!==t.toCurrency)label+=` · 换汇 ${fmt(t.fromAmount,'RUB'===t.fromCurrency?'RUB':'CNY')} → ${fmt(t.toAmount,t.toCurrency)}`}else label=`${accBy(t.account)?.name||'已删除'} · ${t.category||''}`;return `<div class="item row"><div style="min-width:0"><div class="titleline"><span>${t.type==='income'?'💰':t.type==='expense'?'🧾':'↔️'}</span><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.note||t.category||'无备注')}</b></div><small class="muted">${esc(t.date)} · ${esc(label)}</small></div><div style="text-align:right"><b class="amount ${t.type==='income'?'plus':t.type==='expense'?'minus':''}">${sign}${fmt(t.amount??t.fromAmount,t.currency||t.fromCurrency)}</b><br><button class="link muted" onclick="event.stopPropagation();editTx(${t.id})">编辑</button> <button class="link muted" onclick="event.stopPropagation();deleteTx(${t.id})">删除</button></div></div>`}
function populateFilters(){const months=[...new Set(db.tx.map(t=>monthKey(t.date)).filter(Boolean))].sort().reverse();const mf=document.getElementById('monthFilter'),prev=mf.value||'all';mf.innerHTML='<option value="all">全部月份</option>'+months.map(m=>`<option value="${m}">${m}</option>`).join('');if(months.includes(prev))mf.value=prev;const sm=document.getElementById('statMonth'),cur=sm.value||monthKey(new Date());const statMonths=[...new Set([...months,monthKey(new Date())])].sort().reverse();sm.innerHTML=statMonths.map(m=>`<option value="${m}">${m}</option>`).join('');sm.value=statMonths.includes(cur)?cur:statMonths[0]}
function renderBills(){let list=[...db.tx].sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.id)-Number(a.id));const q=(document.getElementById('search')?.value||'').trim().toLowerCase(),mf=document.getElementById('monthFilter')?.value||'all',tf=document.getElementById('typeFilter')?.value||'all',cf=document.getElementById('currencyFilter')?.value||'all';list=list.filter(t=>{const f=accBy(t.account),from=accBy(t.from),to=accBy(t.to);const searchBlob=[t.note,t.category,f?.name,from?.name,to?.name,t.date,t.currency,t.fromCurrency,t.toCurrency].filter(Boolean).join(' ').toLowerCase();const currOk=cf==='all'||t.currency===cf||t.fromCurrency===cf||t.toCurrency===cf;return(!q||searchBlob.includes(q))&&(mf==='all'||monthKey(t.date)===mf)&&(tf==='all'||t.type===tf)&&currOk});document.getElementById('billCount').textContent=`${list.length} 条`;document.getElementById('billList').innerHTML=list.map(renderTxRow).join('')||'<div class="empty">没有符合条件的账单</div>'}
function renderAccounts(){const b=accountBalances();document.getElementById('accountList').innerHTML=db.accounts.map(a=>{const hasTx=db.tx.some(t=>t.account===a.id||t.from===a.id||t.to===a.id);return `<div class="item row"><div><div class="titleline"><b>${esc(a.name)}</b><span class="pill">${typeLabel(a.type)}</span>${a.active===false?'<span class="pill">已停用</span>':''}</div><small class="muted">${a.currency} · 初始 ${fmt(a.initial,a.currency)}</small><br><small class="muted">当前余额：${fmt(b[a.id]||0,a.currency)}</small></div><div><button class="secondary" onclick="editAccount(${a.id})">编辑</button> ${hasTx?`<button class="secondary" onclick="toggleAccountActive(${a.id})">${a.active===false?'启用':'停用'}</button>`:`<button class="danger" onclick="deleteAccount(${a.id})">删除</button>`}</div></div>`}).join('')||'<div class="empty">暂无账户</div>'}
function typeLabel(t){return({bank:'银行',wallet:'电子钱包',cash:'现金',card:'银行卡/信用卡',other:'其他'}[t]||'其他')}
function renderStats(){const ym=selectedMonth(),s=summaryMonth(ym);document.getElementById('monthIn').textContent=fmt(s.inc,'CNY');document.getElementById('monthOut').textContent=fmt(s.exp,'CNY');const entries=Object.entries(s.cats).sort((a,b)=>b[1]-a[1]);const max=Math.max(...entries.map(x=>x[1]),1);document.getElementById('categoryStats').innerHTML=entries.map(([k,v])=>`<div style="margin:12px 0"><div class="row"><span>${esc(k)}</span><b>${fmt(v,'CNY')}</b></div><div class="statbar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<div class="empty">这个月还没有支出</div>';const dates=[];const base=new Date(`${ym}-01T12:00:00`);for(let i=5;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1);dates.push(monthKey(d))}const vals=dates.map(m=>summaryMonth(m).exp),maxV=Math.max(...vals,1);document.getElementById('sixMonthChart').innerHTML=dates.map((m,i)=>`<div class="col"><b style="font-size:10px">${fmt(vals[i],'CNY')}</b><i style="height:${vals[i]/maxV*135}px"></i><span>${m.slice(5)}</span></div>`).join('')}
function renderCategories(){document.getElementById('categoryList').innerHTML=db.categories.map(c=>`<div class="item row"><span>${esc(c)}</span><button class="danger" onclick="removeCategory('${escapeAttr(c)}')">删除</button></div>`).join('');const sel=document.getElementById('txCategory');const cur=sel.value;sel.innerHTML=db.categories.map(c=>`<option value="${escapeAttr(c)}">${esc(c)}</option>`).join('');if(db.categories.includes(cur))sel.value=cur}
function escapeAttr(s){return String(s).replace(/'/g,"\\'")}
function renderSettings(){document.getElementById('rateInput').value=db.rate;document.getElementById('budgetInput').value=db.budget||0;document.getElementById('darkMode').checked=db.dark}
function showPage(id,btn){['home','bills','accounts','stats','settings'].forEach(p=>document.getElementById('page-'+p).classList.toggle('hidden',p!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const active=document.querySelector(`.nav button[data-page="${id}"]`);if(active)active.classList.add('active');if(id==='bills')renderBills();if(id==='accounts')renderAccounts();if(id==='stats')renderStats()}
function openTx(id=null){fillTxForm();document.getElementById('editTxId').value='';document.getElementById('txTitle').textContent='记一笔';document.getElementById('txDate').value=localDate();document.getElementById('txNote').value='';setTxType('expense');if(id){const t=db.tx.find(x=>x.id===id);if(!t)return;document.getElementById('editTxId').value=t.id;document.getElementById('txTitle').textContent='编辑账单';document.getElementById('txDate').value=t.date;document.getElementById('txNote').value=t.note||'';setTxType(t.type);if(t.type==='transfer'){document.getElementById('trFrom').value=t.from;document.getElementById('trTo').value=t.to;document.getElementById('trFromAmount').value=t.fromAmount??t.amount;document.getElementById('trToAmount').value=t.toAmount??t.amount;updateTransferRateText()}else{document.getElementById('txAmount').value=t.amount;document.getElementById('txCurrency').value=t.currency;syncTxAccountToCurrency();document.getElementById('txAccount').value=t.account;document.getElementById('txCategory').value=t.category||db.categories[0]}}document.getElementById('txModal').classList.add('show')}
function fillTxForm(){const cs=[...new Set(db.accounts.map(a=>a.currency))];document.getElementById('txCurrency').innerHTML=cs.map(c=>`<option value="${c}">${c==='CNY'?'🇨🇳':'🇷🇺'} ${c}</option>`).join('');const opts=db.accounts.filter(a=>a.active!==false).map(a=>`<option value="${a.id}">${esc(a.name)} (${a.currency})</option>`).join('');document.getElementById('txAccount').innerHTML=opts;document.getElementById('trFrom').innerHTML=opts;document.getElementById('trTo').innerHTML=opts;document.getElementById('trFromAmount').value='';document.getElementById('trToAmount').value=''}
function setTxType(t){currentTxType=t;document.getElementById('normalFields').classList.toggle('hidden',t==='transfer');document.getElementById('transferFields').classList.toggle('hidden',t!=='transfer');['expense','income','transfer'].forEach(x=>document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===t));if(t==='transfer')updateTransferRateText()}
function syncTxAccountToCurrency(){const c=document.getElementById('txCurrency').value;const opts=db.accounts.filter(a=>a.currency===c).map(a=>`<option value="${a.id}">${esc(a.name)} (${a.currency})</option>`).join('');document.getElementById('txAccount').innerHTML=opts||'<option value="">暂无该币种账户</option>'}
function syncTransferCurrency(){const f=accBy(document.getElementById('trFrom').value),to=accBy(document.getElementById('trTo').value);if(f&&!document.getElementById('trFromAmount').value)document.getElementById('trFromAmount').value='';if(f&&to&&f.currency===to.currency&&document.getElementById('trFromAmount').value)document.getElementById('trToAmount').value=document.getElementById('trFromAmount').value;updateTransferRateText()}
function updateTransferRateText(){const f=accBy(document.getElementById('trFrom').value),to=accBy(document.getElementById('trTo').value),a=Number(document.getElementById('trFromAmount').value||0),b=Number(document.getElementById('trToAmount').value||0);document.getElementById('trRateText').textContent=f&&to?a>0?(b/a).toFixed(6)+` ${to.currency}/${f.currency}`:'—':'—'}
function saveTx(){const editId=Number(document.getElementById('editTxId').value||0),type=currentTxType,date=document.getElementById('txDate').value,note=document.getElementById('txNote').value.trim();if(!date)return toast('请选择日期');let obj;if(type==='transfer'){const from=Number(document.getElementById('trFrom').value),to=Number(document.getElementById('trTo').value),fromA=Number(document.getElementById('trFromAmount').value),toA=Number(document.getElementById('trToAmount').value),fa=accBy(from),ta=accBy(to);if(!fa||!ta||from===to)return toast('请选择两个不同账户');if(!(fromA>0&&toA>0))return toast('请输入转出和转入金额');obj={type,from,to,fromCurrency:fa.currency,toCurrency:ta.currency,fromAmount:fromA,toAmount:toA,amount:fromA,currency:fa.currency,date,note};}else{const amount=Number(document.getElementById('txAmount').value),account=Number(document.getElementById('txAccount').value),currency=document.getElementById('txCurrency').value,category=document.getElementById('txCategory').value;if(!(amount>0))return toast('金额必须大于 0');const a=accBy(account);if(!a||a.currency!==currency)return toast('账户与币种不匹配');obj={type,amount,currency,account,category,date,note};}if(editId){const idx=db.tx.findIndex(t=>t.id===editId);if(idx>=0)db.tx[idx]={...db.tx[idx],...obj}}else db.tx.push({id:Date.now()+Math.floor(Math.random()*1000),createdAt:Date.now(),...obj});persist();closeModal('txModal');render();toast('账单已保存')}
function editTx(id){openTx(id)}
function deleteTx(id){const t=db.tx.find(x=>x.id===id);if(!t)return;if(confirm('确定删除这笔账单吗？删除后余额和统计会立即更新。')){db.tx=db.tx.filter(x=>x.id!==id);persist();render();toast('账单已删除')}}
function openAccount(id=null){document.getElementById('editAccId').value='';document.getElementById('accTitle').textContent='添加账户';document.getElementById('accName').value='';document.getElementById('accType').value='bank';document.getElementById('accCurrency').value='RUB';document.getElementById('accBalance').value='0';if(id){const a=accBy(id);if(!a)return;document.getElementById('editAccId').value=id;document.getElementById('accTitle').textContent='编辑账户';document.getElementById('accName').value=a.name;document.getElementById('accType').value=a.type||'bank';document.getElementById('accCurrency').value=a.currency;document.getElementById('accBalance').value=a.initial}document.getElementById('accModal').classList.add('show')}
function editAccount(id){openAccount(id)}
function saveAccount(){const id=Number(document.getElementById('editAccId').value||0),name=document.getElementById('accName').value.trim(),type=document.getElementById('accType').value,currency=document.getElementById('accCurrency').value,initial=Number(document.getElementById('accBalance').value||0);if(!name)return toast('请输入账户名称');if(!Number.isFinite(initial))return toast('初始余额不正确');if(id){const a=accBy(id),hasTx=db.tx.some(t=>t.account===id||t.from===id||t.to===id);if(a&&hasTx&&a.currency!==currency)return toast('已有账单的账户不能直接更换币种');Object.assign(a,{name,type,currency,initial})}else db.accounts.push({id:Date.now()+Math.floor(Math.random()*1000),name,type,currency,initial,active:true});persist();closeModal('accModal');render();toast(id?'账户已修改':'账户已添加')}
function toggleAccountActive(id){const a=accBy(id);if(!a)return;a.active=a.active===false;persist();render();toast(a.active?'账户已启用':'账户已停用')}
function deleteAccount(id){const hasTx=db.tx.some(t=>t.account===id||t.from===id||t.to===id);if(hasTx){return toast('已有历史账单的账户不能删除，可选择停用。')}if(!confirm('确定删除这个账户吗？'))return;db.accounts=db.accounts.filter(a=>a.id!==id);persist();render();toast('账户已删除')}
function openSettings(){showPage('settings')}
function saveSettings(){const r=Number(document.getElementById('rateInput').value),b=Number(document.getElementById('budgetInput').value||0);if(!(r>0))return toast('汇率必须大于 0');if(b<0)return toast('预算不能小于 0');db.rate=r;db.budget=b;db.dark=document.getElementById('darkMode').checked;persist();render();toast('设置已保存')}
function toggleDark(){db.dark=document.getElementById('darkMode').checked;persist();document.body.classList.toggle('dark',db.dark)}
function openCategoryManager(){renderCategories();document.getElementById('categoryModal').classList.add('show')}
function addCategory(){const c=prompt('请输入新分类');if(!c)return;const v=c.trim();if(!v)return;if(db.categories.includes(v))return toast('这个分类已经存在');db.categories.push(v);persist();render();openCategoryManager()}
function removeCategory(c){if(db.categories.length<=1)return toast('至少保留一个分类');if(confirm(`删除分类“${c}”？历史账单不会删除，但以后不能新选这个分类。`)){db.categories=db.categories.filter(x=>x!==c);persist();render();openCategoryManager()}}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`我的记账本备份_${localDate()}.json`;a.click();URL.revokeObjectURL(url);toast('备份已导出')}
function importData(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d.accounts||!d.tx)throw new Error('格式错误');if(!confirm('导入会覆盖当前账本，建议先导出当前备份。继续吗？'))return;db=d;db.version=VERSION;db.rate=Number(db.rate)||11;db.budget=Number(db.budget)||0;db.categories=Array.isArray(db.categories)&&db.categories.length?db.categories:[...defaultCategories];persist();render();toast('备份已导入')}catch(err){toast('导入失败：文件格式不正确')}finally{e.target.value=''}};reader.readAsText(file)}
function csvEscape(v){const s=String(v??'');return /[\",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){const headers=['日期','类型','金额','币种','账户/转出账户','转入账户','分类','备注'];const rows=db.tx.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(t=>{const type=t.type==='income'?'收入':t.type==='expense'?'支出':'转账/换汇';const from=accBy(t.from)?.name||accBy(t.account)?.name||'';const to=accBy(t.to)?.name||'';const amount=t.type==='transfer'?`${t.fromAmount} → ${t.toAmount}`:t.amount;const currency=t.type==='transfer'?`${t.fromCurrency} → ${t.toCurrency}`:t.currency;return [t.date,type,amount,currency,from,to,t.category||'',t.note||''].map(csvEscape).join(',')});const blob=new Blob(['\ufeff'+[headers,...rows].map(r=>Array.isArray(r)?r.map(csvEscape).join(','):r).join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`我的记账本_${localDate()}.csv`;a.click();URL.revokeObjectURL(url);toast('CSV 已导出')}
function seedDemo(){if(db.tx.length&& !confirm('当前已有账单，继续会追加演示数据。'))return;const ids=db.accounts.map(a=>a.id);if(ids.length<2)return toast('至少需要两个账户');const rub=ids.find(id=>accBy(id).currency==='RUB')||ids[0],cny=ids.find(id=>accBy(id).currency==='CNY')||ids[1];const d=localDate();db.tx.push({id:Date.now()+1,type:'income',amount:30000,currency:accBy(rub).currency,account:rub,category:'工资',date:d,note:'演示收入'},{id:Date.now()+2,type:'expense',amount:450,currency:accBy(rub).currency,account:rub,category:'餐饮',date:d,note:'午饭'},{id:Date.now()+3,type:'transfer',from:rub,to:cny,fromCurrency:'RUB',toCurrency:'CNY',fromAmount:5500,toAmount:500,currency:'RUB',amount:5500,date:d,note:'演示换汇'});persist();render();toast('已加入演示数据')}
function resetData(){if(!confirm('确定清空所有账户和账单吗？此操作不可撤销，请先导出备份。'))return;db=clone(defaultDB);persist();render();toast('已清空数据')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function init(){document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});render();document.body.classList.toggle('dark',db.dark);setTxType('expense');document.querySelectorAll('#transferFields input').forEach(x=>x.addEventListener('input',updateTransferRateText));document.getElementById('trFrom').addEventListener('change',updateTransferRateText);document.getElementById('trTo').addEventListener('change',updateTransferRateText);if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}
init();
</script>
</body>
